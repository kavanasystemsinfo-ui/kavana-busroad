# fly.toml para Kavana BusRoad backend (FastAPI)
app = "busroad-api"
primary_region = "cdg"

[build]
  dockerfile = "backend/Dockerfile"

[env]
  PYTHONUNBUFFERED = "1"
  BUSROAD_DOCS_ROOT = "/app"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

[[vm]]
  memory = "256mb"
  cpu_kind = "shared"
  cpus = 1
