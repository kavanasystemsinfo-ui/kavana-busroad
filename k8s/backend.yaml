apiVersion: apps/v1
kind: Deployment
metadata:
  name: busroad-backend
  labels:
    app: busroad-backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: busroad-backend
  template:
    metadata:
      labels:
        app: busroad-backend
    spec:
      containers:
        - name: backend
          image: kavana-busroad-backend:0.1.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          env:
            - name: GOOGLE_API_KEY
              valueFrom:
                secretKeyRef:
                  name: busroad-secrets
                  key: google_api_key
                  optional: true
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 384Mi
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /api/v1/health
              port: 8000
            initialDelaySeconds: 3
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: busroad-backend
  labels:
    app: busroad-backend
spec:
  type: NodePort
  selector:
    app: busroad-backend
  ports:
    - port: 80
      targetPort: 8000
      protocol: TCP
      nodePort: 30080
